name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package theme and plugin
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/Neverlose dist/neverlose-theme-settings
          mkdir -p dist/combined/themes dist/combined/plugins

          cp manifest.json theme.css preview.png settings.png preview.html \
             README.md LICENSE FONTS.md OFL.txt dist/Neverlose/
          cp -R fonts dist/Neverlose/fonts
          cp -R plugin/neverlose-theme-settings/. dist/neverlose-theme-settings/

          (cd dist && zip -qr ../Neverlose.zip Neverlose)
          (cd dist && zip -qr ../neverlose-theme-settings.zip neverlose-theme-settings)

          cp -R dist/Neverlose dist/combined/themes/
          cp -R dist/neverlose-theme-settings dist/combined/plugins/
          cat > dist/combined/INSTALL.txt <<'EOF'
          Neverlose for Obsidian
          ======================

          1. Copy themes/Neverlose into <vault>/.obsidian/themes/
          2. Copy plugins/neverlose-theme-settings into <vault>/.obsidian/plugins/
          3. Restart Obsidian.
          4. Settings -> Appearance -> Themes -> Neverlose
          5. Settings -> Community plugins -> enable Neverlose Theme Settings

          Or use install.ps1 / install.sh from the release.
          EOF
          (cd dist/combined && zip -qr ../../Neverlose-obsidian.zip themes plugins INSTALL.txt)

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Neverlose for Obsidian ${{ inputs.tag }}
          generate_release_notes: true
          files: |
            Neverlose.zip
            neverlose-theme-settings.zip
            Neverlose-obsidian.zip
            install.ps1
            install.sh
